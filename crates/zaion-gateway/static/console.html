<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAION :: Agentic Process OS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;--fg:#00ff00;--amber:#ffb000;--dim:#1a3a1a;
  --border:#1a3a1a;--panel:#0d0d0d;--red:#ff3333;--cyan:#00cccc;
}
@font-face{font-family:mono;src:local('Cascadia Mono'),local('Fira Code'),local('Consolas'),local('monospace')}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'Cascadia Mono','Fira Code',Consolas,monospace;font-size:13px;overflow:hidden}

/* scanline overlay */
body::after{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.15) 2px,rgba(0,0,0,0.15) 4px);
  animation:scanflicker 8s linear infinite;
}
@keyframes scanflicker{0%,100%{opacity:.6}50%{opacity:.4}}

/* layout */
#root{display:grid;grid-template-columns:220px 1fr 280px;grid-template-rows:32px 1fr 24px;height:100vh;gap:1px;background:var(--border)}
#topbar{grid-column:1/-1;background:var(--panel);display:flex;align-items:center;padding:0 12px;gap:16px}
#topbar .logo{color:var(--amber);font-weight:bold;letter-spacing:2px}
#topbar .status{margin-left:auto;color:var(--dim);font-size:11px}
#topbar .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
#topbar .dot.on{background:var(--fg);box-shadow:0 0 6px var(--fg)}
#topbar .dot.off{background:var(--red)}

#processes{grid-column:1;background:var(--panel);overflow-y:auto;padding:8px}
#conversation{grid-column:2;background:var(--bg);display:flex;flex-direction:column}
#right{grid-column:3;display:flex;flex-direction:column;gap:1px}
#topology{flex:1;background:var(--panel);position:relative;min-height:0}
#statusbar{flex:0 0 180px;background:var(--panel);padding:8px;overflow-y:auto}
#footer{grid-column:1/-1;background:var(--panel);display:flex;align-items:center;padding:0 12px;font-size:11px;color:var(--dim)}

/* process list */
.proc-header{color:var(--amber);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.proc-item{padding:4px 6px;cursor:pointer;border-radius:2px;display:flex;align-items:center;gap:6px;font-size:12px}
.proc-item:hover{background:var(--dim)}
.proc-item.active{background:#0f2f0f;color:#fff}
.proc-item .pid{color:var(--dim);font-size:10px}
.proc-status{font-size:9px;padding:1px 4px;border-radius:2px;text-transform:uppercase}
.proc-status.running{background:#0f2f0f;color:var(--fg)}
.proc-status.sleeping{background:#2f2f0f;color:var(--amber)}

/* conversation */
#conv-scroll{flex:1;overflow-y:auto;padding:12px}
.msg{margin-bottom:10px;padding:6px 8px;border-left:2px solid var(--border);font-size:12px;line-height:1.5}
.msg.user{border-color:var(--amber)}
.msg.assistant{border-color:var(--fg)}
.msg.tool{border-color:var(--cyan);font-size:11px;opacity:.85}
.msg.error{border-color:var(--red);color:var(--red)}
.msg .role{font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.msg .role.user-role{color:var(--amber)}
.msg .role.assistant-role{color:var(--fg)}
.msg .role.tool-role{color:var(--cyan)}
.msg .ts{float:right;color:var(--dim);font-size:10px}
.thinking{color:var(--dim);font-style:italic;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

#input-bar{display:flex;border-top:1px solid var(--border);padding:6px 8px;gap:6px;background:var(--panel)}
#input-bar input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--fg);padding:4px 8px;font-family:inherit;font-size:12px;outline:none}
#input-bar input:focus{border-color:var(--fg)}
#input-bar button{background:var(--dim);color:var(--fg);border:1px solid var(--border);padding:4px 12px;cursor:pointer;font-family:inherit;font-size:11px}
#input-bar button:hover{background:var(--fg);color:var(--bg)}

/* topology canvas */
#topo-canvas{width:100%;height:100%;display:block}

/* status panel */
.stat-header{color:var(--amber);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.stat-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}
.stat-row .label{color:var(--dim)}
.bar-wrap{height:10px;background:var(--bg);border:1px solid var(--border);margin:4px 0 8px;border-radius:1px;overflow:hidden}
.bar-fill{height:100%;transition:width .3s}
.bar-fill.green{background:var(--fg)}
.bar-fill.amber{background:var(--amber)}
.bar-fill.red{background:var(--red)}
</style>
</head>
<body>
<div id="root">
  <div id="topbar">
    <div class="logo">ZAION</div>
    <div class="status"><span class="dot off" id="ws-dot"></span><span id="ws-status">DISCONNECTED</span></div>
  </div>
  <div id="processes">
    <div class="proc-header">Processes</div>
    <div id="proc-list"></div>
  </div>
  <div id="conversation">
    <div id="conv-scroll"></div>
    <div id="input-bar">
      <input type="text" id="msg-input" placeholder="Type message..." />
      <button id="send-btn">SEND</button>
    </div>
  </div>
  <div id="right">
    <div id="topology">
      <canvas id="topo-canvas"></canvas>
    </div>
    <div id="statusbar">
      <div class="stat-header">Token Budget</div>
      <div class="stat-row"><span class="label">Used</span><span id="tokens-used">0</span></div>
      <div class="stat-row"><span class="label">Total</span><span id="tokens-total">200000</span></div>
      <div class="bar-wrap"><div class="bar-fill green" id="token-bar" style="width:0%"></div></div>
      <div class="stat-header">Evolution</div>
      <div class="stat-row"><span class="label">Cycles</span><span id="evo-cycles">0</span></div>
      <div class="stat-row"><span class="label">Sync</span><span id="sync-status">IDLE</span></div>
    </div>
  </div>
  <div id="footer">
    <span>Zaion v0.1.0 | Godkiller v2 Console | <span id="client-count">0</span> clients</span>
  </div>
</div>
<script>
// === ZAION CONSOLE CLIENT ===
const WS_URL = `ws://${location.host}/ws`;
let ws = null;
let reconnectTimer = null;
let activeProcess = null;

// DOM refs
const wsDot = document.getElementById('ws-dot');
const wsStatus = document.getElementById('ws-status');
const procList = document.getElementById('proc-list');
const convScroll = document.getElementById('conv-scroll');
const msgInput = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const canvas = document.getElementById('topo-canvas');
const ctx = canvas.getContext('2d');

// State
const processes = [];
const messages = [];
let tokensUsed = 0;
let tokensTotal = 200000;

// Connect WebSocket
function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    wsDot.className = 'dot on';
    wsStatus.textContent = 'CONNECTED';
    clearTimeout(reconnectTimer);
    send({ type: 'ping', payload: {} });
  };
  ws.onclose = () => {
    wsDot.className = 'dot off';
    wsStatus.textContent = 'DISCONNECTED';
    reconnectTimer = setTimeout(connect, 3000);
  };
  ws.onerror = () => {
    wsDot.className = 'dot off';
    wsStatus.textContent = 'ERROR';
  };
  ws.onmessage = (e) => handleEvent(JSON.parse(e.data));
}

function send(cmd) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(cmd));
  }
}

function handleEvent(evt) {
  switch (evt.type) {
    case 'message':
      messages.push({ role: 'assistant', text: evt.payload.text || JSON.stringify(evt.payload), ts: evt.ts });
      renderMessages();
      break;
    case 'tool_call':
      messages.push({ role: 'tool', text: `[TOOL] ${evt.payload.name || 'unknown'}`, ts: evt.ts });
      renderMessages();
      break;
    case 'token_usage':
      tokensUsed = evt.payload.used || 0;
      tokensTotal = evt.payload.total || 200000;
      updateTokenBar();
      break;
    case 'error':
      messages.push({ role: 'error', text: evt.payload.error || 'Unknown error', ts: evt.ts });
      renderMessages();
      break;
    case 'process_list':
      processes.length = 0;
      processes.push(...(evt.payload.processes || []));
      renderProcesses();
      break;
    case 'pong':
      console.log('pong received');
      break;
  }
}

function renderProcesses() {
  procList.innerHTML = processes.map(p => {
    const eid = escapeHtml(p.id || '');
    const ename = escapeHtml(p.name || p.id || '');
    const estatus = escapeHtml(p.status || '');
    const isActive = p.id === activeProcess ? 'active' : '';
    return `<div class="proc-item ${isActive}" data-pid="${eid}">
      <span class="proc-status ${estatus}">${estatus}</span>
      <span>${ename}</span>
      <span class="pid">${eid.slice(0, 8)}</span>
    </div>`;
  }).join('');
  procList.querySelectorAll('.proc-item').forEach(el => {
    el.addEventListener('click', () => switchProcess(el.dataset.pid));
  });
}

function switchProcess(pid) {
  activeProcess = pid;
  send({ type: 'switch_process', payload: { process_id: pid } });
  renderProcesses();
}

function renderMessages() {
  convScroll.innerHTML = messages.map(m => {
    const roleClass = m.role === 'user' ? 'user-role' : m.role === 'tool' ? 'tool-role' : 'assistant-role';
    const ts = new Date(m.ts).toLocaleTimeString();
    return `<div class="msg ${m.role}"><div class="role ${roleClass}">${m.role}<span class="ts">${ts}</span></div><div>${escapeHtml(m.text)}</div></div>`;
  }).join('');
  convScroll.scrollTop = convScroll.scrollHeight;
}

function updateTokenBar() {
  const pct = Math.min(100, (tokensUsed / tokensTotal) * 100);
  const bar = document.getElementById('token-bar');
  bar.style.width = pct + '%';
  bar.className = 'bar-fill ' + (pct > 80 ? 'red' : pct > 50 ? 'amber' : 'green');
  document.getElementById('tokens-used').textContent = tokensUsed;
  document.getElementById('tokens-total').textContent = tokensTotal;
}

function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;
  messages.push({ role: 'user', text, ts: Date.now() });
  renderMessages();
  send({ type: 'send_message', payload: { text } });
  msgInput.value = '';
}

sendBtn.onclick = sendMessage;
msgInput.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Neural topology animation
let frame = 0;
function resizeCanvas() {
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function drawTopology() {
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#0d0d0d';
  ctx.fillRect(0, 0, w, h);

  // Trinity nodes
  const nodes = [
    { x: w * 0.5, y: h * 0.3, label: 'TRINITY' },
    { x: w * 0.3, y: h * 0.6, label: 'OUROBOROS' },
    { x: w * 0.7, y: h * 0.6, label: 'HERMES' }
  ];

  // Draw connections
  ctx.strokeStyle = '#1a3a1a';
  ctx.lineWidth = 1;
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      ctx.beginPath();
      ctx.moveTo(nodes[i].x, nodes[i].y);
      ctx.lineTo(nodes[j].x, nodes[j].y);
      ctx.stroke();
    }
  }

  // Draw nodes
  nodes.forEach((n, i) => {
    const pulse = Math.sin(frame * 0.05 + i * 2) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(0, 255, 0, ${pulse})`;
    ctx.beginPath();
    ctx.arc(n.x, n.y, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#00ff00';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(n.label, n.x, n.y + 20);
  });

  frame++;
  requestAnimationFrame(drawTopology);
}
drawTopology();

// Init
connect();
</script>
</body>
</html>
