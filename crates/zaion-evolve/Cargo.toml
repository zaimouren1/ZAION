[package]
name = "zaion-evolve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zaion-types    = { path = "../zaion-types" }
zaion-codex    = { path = "../zaion-codex" }
zaion-crypto   = { path = "../zaion-crypto" }
serde          = { workspace = true }
serde_json     = { workspace = true }
chrono         = { workspace = true }
thiserror      = { workspace = true }
sha2           = { workspace = true }
hex            = { workspace = true }
# H24/H25 fix: no longer uses `reqwest::blocking` in code; async reqwest +
# lazy tokio runtime via `run_async` wrapper.  The workspace dep keeps
# "blocking" enabled for other crates; it is simply unused here now.
reqwest        = { workspace = true, features = ["json"] }
tokio          = { workspace = true }
tree-sitter    = "0.26"
tree-sitter-rust = "0.24"

[dev-dependencies]
tempfile       = { workspace = true }
