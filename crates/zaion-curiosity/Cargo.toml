[package]
name = "zaion-curiosity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zaion-types = { path = "../zaion-types" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
# H23 fix: no longer uses `reqwest::blocking` in code; async reqwest + lazy
# tokio runtime via `call_llm_sync` wrapper.  The workspace dep keeps
# "blocking" enabled for other crates; it is simply unused here now.
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true }
git2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
