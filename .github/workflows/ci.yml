name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust 1.93.0 / declared MSRV (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Validate product gates
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/validate-product-gates.ps1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check all Rust targets
        run: cargo check --workspace --all-targets --locked

      - name: Run workspace tests and fresh-home CLI smoke tests
        run: cargo test --workspace --locked -j1 -- --test-threads=1

      - name: Run source architecture audit
        run: cargo run -p zaion-cli --locked -- architecture-audit --root .

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Cross-system semantic chain eval
        if: runner.os == 'Linux'
        run: python3 eval/harness/cross_system_eval.py target/debug/zaion

  release-validation:
    name: Release Validation
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release assets and install chain
        run: bash scripts/check-release-assets.sh

  security-audit:
    name: Scheduled Security Audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  release:
    name: Release (${{ matrix.target }})
    needs: [rust, release-validation]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: zaion
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: zaion
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: zaion
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: zaion.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-

      - name: Build release binary
        run: cargo build --release --bin zaion --target ${{ matrix.target }} --locked

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -C target/${{ matrix.target }}/release -czf zaion-${{ github.ref_name }}-${{ matrix.target }}.tar.gz zaion

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../zaion-${{ github.ref_name }}-${{ matrix.target }}.zip zaion.exe

      - name: Generate checksum (Unix)
        if: runner.os != 'Windows'
        run: |
          archive="zaion-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"

      - name: Generate checksum (Windows)
        if: runner.os == 'Windows'
        run: |
          $archive = "zaion-${{ github.ref_name }}-${{ matrix.target }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Out-File -FilePath "$archive.sha256" -Encoding ascii
          Get-Content "$archive.sha256"

      - name: Sign (Windows Authenticode)
        if: runner.os == 'Windows' && env.AZURE_TENANT_ID != ''
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          # TODO: fill in after provisioning Azure Trusted Signing
          # azuresigntool sign -kvu https://<vault>.vault.azure.net -kvc <cert> `
          #   -tr http://timestamp.acs.microsoft.com -td sha256 `
          #   zaion-${{ github.ref_name }}-${{ matrix.target }}.zip
          echo "Windows Authenticode signing not configured (secret empty)."

      - name: Sign + notarize (macOS)
        if: runner.os == 'macOS' && env.APPLE_IDENTITY != ''
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          # TODO: fill in after provisioning Apple Developer ID
          # codesign --deep --force --options runtime --sign "$APPLE_IDENTITY" <binary>
          # xcrun notarytool submit <archive> --apple-id $APPLE_ID --password $APPLE_PASSWORD --team-id <TEAM>
          # xcrun stapler staple <archive>
          echo "macOS signing/notarization not configured (secret empty)."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zaion-${{ matrix.target }}
          path: zaion-${{ github.ref_name }}-${{ matrix.target }}.*

      - name: Create GitHub Release
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true

  upload-release-assets:
    name: Upload Release Assets
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Sign artifacts (Ed25519)
        env:
          RELEASE_ED25519_KEY: ${{ secrets.RELEASE_ED25519_KEY }}
        run: |
          if [ -z "$RELEASE_ED25519_KEY" ]; then
            echo "RELEASE_ED25519_KEY secret not set; skipping Ed25519 signing."
          else
            echo "$RELEASE_ED25519_KEY" > release-ed25519.pem
            cp scripts/release-ed25519.pub.pem release-ed25519.pub.pem
            find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) | while read -r f; do
              openssl pkeyutl -sign -inkey release-ed25519.pem -rawin -in "$f" -out "$f.sig"
              echo "signed: $f"
            done
            rm -f release-ed25519.pem
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            release-ed25519.pub.pem
